name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]  # pinned: ubuntu-latest moved to 26.04 on 10-24 and broke hosted jobs elsewhere
        python: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Some tests exercise the page's JavaScript through node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10"
          python -m pytest tests -q -rs

# ponytail: ceiling = ubuntu-24.04 and macos-15 only, so no Intel mac and no
# Windows leg is covered; upgrade path = add windows-latest or macos-13 to the
# os matrix when a platform-specific bug needs it.
