[project]
name = "coco-atlas"
version = "0.7.3"
description = "Local live control room for an agentic lab."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "journey: Heliopause user journey. Counted by pytest -m journey.",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
